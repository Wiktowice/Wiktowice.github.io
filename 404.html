<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nie znaleziono strony | Wiktowice</title>
    <meta name="description" content="Strona nie została znaleziona. Wróć na stronę główną serwera Wiktowice.">
    <meta name="robots" content="noindex, follow">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wiktowice.github.io/404.html">
    <meta property="og:title" content="404 - Nie znaleziono strony">
    <meta property="og:description" content="Strona nie została znaleziona.">
    <meta property="og:image" content="https://wiktowice.github.io/logo.png">

    <!-- PWA / Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4b6920">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <!-- Styles & Fonts -->
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            background: #000 url('tlo.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 40px;
            background: rgba(18, 18, 18, 0.9);
            border: 2px solid #333;
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 64px;
            color: #ef4444;
            /* Red for Error */
            margin: 0 0 20px 0;
            text-shadow: 4px 4px 0px #000;
        }

        h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            color: #d4a017;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        p {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: #d4a017;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .btn:hover {
            background: #b8860b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 160, 23, 0.3);
        }

        .glitch {
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="overlay"></div>
    <div class="content">
        <h1 class="glitch">404</h1>
        <h2>ZGUBIŁEŚ SIĘ W GRZE?</h2>
        <p>
            Wygląda na to, że strona, której szukasz, została usunięta,
            przeniesiona lub nigdy nie istniała.<br>
            Wróć do bezpiecznej strefy.
        </p>
        <div style="margin-top: 30px;">
            <a href="index.html" class="btn">WRÓĆ NA STRONĘ GŁÓWNĄ</a>
            <a href="admin.html" class="btn btn-sec">PANEL ADMINA</a>
        </div>
    </div>

    <style>
        .btn-sec {
            display: inline-block;
            padding: 15px 30px;
            background: transparent;
            border: 2px solid #555;
            color: #aaa;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            margin-left: 10px;
            font-size: 12px;
        }

        .btn-sec:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
            color: #fff;
        }
    </style>

    <!-- Supabase & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_config.js"></script>
    <script src="script.js"></script>
</body>

</html>
